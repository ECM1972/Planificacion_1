<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DosiLab: Simulador Dosimetría Física y Clínica</title>
    <!-- Incluir Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        .h-screen-full { height: 100vh; }
        .dvh-graph svg, .pdd-graph svg { width: 100%; height: 100%; }
        /* Animaciones suaves */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans overflow-hidden">

    <div id="app" class="flex flex-col md:flex-row h-screen-full overflow-hidden">
        
        <!-- --- PANEL IZQUIERDO: CONTROLES --- -->
        <div class="w-full md:w-1/3 p-4 overflow-y-auto border-r border-gray-800 flex flex-col gap-4 bg-gray-900/50">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2 text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93"/></svg>
                    <h1 class="text-xl font-bold">DosiLab v3.0</h1>
                </div>
                <button onclick="resetApp()" class="text-gray-500 hover:text-white transition" title="Resetear Todo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                </button>
            </div>

            <!-- NAVEGACIÓN DE PESTAÑAS (ORDENADA) -->
            <div class="flex gap-1 bg-gray-900 p-1 rounded-lg border border-gray-700">
                <button id="mode-anatomy" onclick="setMode('anatomy')" class="flex-1 flex flex-col items-center justify-center py-2 px-1 text-xs rounded-md transition hover:bg-gray-800">
                    <span class="font-bold text-lg mb-1">1</span>
                    <span>Anatomía</span>
                </button>
                <button id="mode-beam" onclick="setMode('beam')" class="flex-1 flex flex-col items-center justify-center py-2 px-1 text-xs rounded-md transition hover:bg-gray-800">
                    <span class="font-bold text-lg mb-1">2</span>
                    <span>Selección Haz</span>
                </button>
                <button id="mode-planning" onclick="setMode('planning')" class="flex-1 flex flex-col items-center justify-center py-2 px-1 text-xs rounded-md transition hover:bg-gray-800">
                    <span class="font-bold text-lg mb-1">3</span>
                    <span>Planificación</span>
                </button>
            </div>

            <div id="controls-panel" class="flex-1 flex flex-col gap-3 fade-in">
                <!-- Contenido dinámico de las pestañas -->
            </div>
        </div>

        <!-- --- PANEL DERECHO: SIMULACIÓN --- -->
        <div class="flex-1 p-4 flex flex-col gap-4 bg-gray-950 overflow-y-auto">
            
            <div class="flex flex-col lg:flex-row gap-6 items-start justify-center min-h-[320px]">
                
                <!-- VISUALIZADOR 2D -->
                <div class="flex flex-col items-center">
                    <h3 class="text-gray-400 text-sm mb-2 font-medium flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg> 
                        Distribución de Dosis (Axial)
                    </h3>
                    <div id="heatmap-container"></div>
                </div>

                <!-- GRÁFICAS (DVH) -->
                <div class="flex-1 w-full max-w-md">
                    <h3 class="text-gray-400 text-sm mb-2 font-medium flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
                        Histograma Dosis-Volumen (DVH)
                    </h3>
                    <div id="dvh-graph" class="h-64 w-full dvh-graph bg-gray-900 rounded border border-gray-700 p-2"></div>
                </div>
            </div>

            <!-- RESULTADOS CLÍNICOS -->
            <div id="metrics-panel" class="bg-gray-900 p-4 rounded-xl border border-gray-800 mt-auto fade-in"></div>

        </div>
    </div>

    <script>
        // --- CONSTANTES ---
        const GRID_SIZE = 60; 
        const MAX_DOSE_DISPLAY = 110;
        const FIXED_ANATOMY = { BODY: { cx: 30, cy: 30, rx: 28, ry: 22 } };
        const COLORS = { PTV: '#ef4444', OAR_BASE: '#3b82f6', BODY: '#374151', BEAM: '#fbbf24' };

        // Definición de Energías y sus parámetros PDD aproximados
        const ENERGIES = {
            'E5':  { type: 'electron', name: 'Electrones 5 MeV',  color: '#f472b6', range: 8,  falloff: 3 }, // Rango muy corto (superficial)
            'E15': { type: 'electron', name: 'Electrones 15 MeV', color: '#db2777', range: 20, falloff: 5 }, // Rango medio
            'X6':  { type: 'photon',   name: 'Fotones 6 MV',      color: '#fbbf24', mu: 0.045 },             // Atenuación estándar
            'X18': { type: 'photon',   name: 'Fotones 18 MV',     color: '#f59e0b', mu: 0.025 }              // Más penetrante
        };

        // --- ESTADO GLOBAL ---
        let state = {
            mode: 'anatomy', // Iniciar en anatomía como pidió el usuario
            energyKey: 'X6', // Energía por defecto
            ptv: { cx: 30, cy: 25, r: 6 },
            oars: [{ id: 1, cx: 30, cy: 38, r: 5, name: 'Recto' }],
            beams: [{ id: 1, angle: 0, weight: 1.0, wedge: 0, width: 16 }],
            doseMatrix: [],
            dvhData: { ptv: [], oars: [] },
            metrics: { ptvD95: 0, ptvMax: 0, oars: [] }
        };

        // --- FÍSICA Y DOSIMETRÍA ---

        function getDepthFactor(distFromSurface, energyKey) {
            const params = ENERGIES[energyKey];
            
            // Si estamos en el aire (antes de la superficie), dosis 0 (simplificado)
            if (distFromSurface < 0) return 0;

            if (params.type === 'photon') {
                // Ley exponencial con Build-up simple
                // dmax aprox: 6MV ~ 1.5cm (3px), 18MV ~ 3cm (6px)
                const dmax = energyKey === 'X6' ? 3 : 6;
                let buildup = 1;
                if (distFromSurface < dmax) {
                    buildup = 0.5 + 0.5 * (distFromSurface / dmax); // Sube de 50% a 100%
                }
                return buildup * Math.exp(-params.mu * distFromSurface);
            } 
            else if (params.type === 'electron') {
                // Meseta alta y caída brusca
                // Usamos función sigmoide inversa o lineal clamp para la caída
                if (distFromSurface < params.range) {
                    return 1.0; // Meseta terapéutica
                } else if (distFromSurface < params.range + params.falloff) {
                    // Caída lineal (Bremsstrahlung tail ignorado por simplicidad visual)
                    const progress = (distFromSurface - params.range) / params.falloff;
                    return 1.0 - progress;
                } else {
                    return 0.0;
                }
            }
            return 0;
        }

        function calculateSingleBeamDose(x, y, beam) {
            // Geometría del Haz
            const isoX = state.ptv.cx; 
            const isoY = state.ptv.cy; 
            const dx = x - isoX;
            const dy = y - isoY;
            const rad = (beam.angle * Math.PI) / 180;
            
            // Coordenadas locales del haz (beamY es profundidad relativa al isocentro)
            // beamY negativo = hacia la fuente, positivo = detrás del isocentro
            const beamX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const beamY = dx * Math.sin(rad) + dy * Math.cos(rad);

            // 1. Colimación (Ancho de campo)
            const halfWidth = beam.width / 2;
            if (Math.abs(beamX) > halfWidth) return 0;

            // 2. Calcular Profundidad "Real" aproximada
            // Asumimos que la superficie está a una distancia fija 'R_SURFACE' del isocentro
            // En nuestra anatomía, el cuerpo es R~25px. El isocentro suele estar a 5-15px de profundidad.
            // Para propósitos didácticos, fijaremos la distancia Fuente-Superficie relativa.
            // Digamos que la superficie está a 20 pixeles "arriba" del isocentro en el eje del haz.
            const distToIso = 20; 
            const depth = beamY + distToIso; // Profundidad en píxeles

            // 3. PDD (Rendimiento en Profundidad)
            const depthFactor = getDepthFactor(depth, state.energyKey);

            // 4. Penumbra y Cuñas
            const penumbra = 2; 
            const distToEdge = halfWidth - Math.abs(beamX);
            let edgeFactor = 1;
            if (distToEdge < penumbra) edgeFactor = distToEdge / penumbra;

            let wedgeFactor = 1;
            if (beam.wedge > 0) {
              const gradient = (beamX + halfWidth) / (beam.width); 
              const attenuationStrength = (beam.wedge / 90) * 0.8; 
              wedgeFactor = 1 - (gradient * attenuationStrength);
            }

            const baseOutput = 70; // Ajuste para escala visual
            return baseOutput * beam.weight * depthFactor * edgeFactor * wedgeFactor;
        }

        function calculateDoseDistribution() {
            const matrix = [];
            const ptvDoses = [];
            const oarsDoses = state.oars.map(() => []);

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const inBody = isInsideEllipse(x, y, FIXED_ANATOMY.BODY);
                    const inPTV = isInsideCircle(x, y, state.ptv); 
                    
                    const inOARIndices = [];
                    state.oars.forEach((oar, idx) => {
                        if (isInsideCircle(x, y, oar)) inOARIndices.push(idx);
                    });

                    let totalDose = 0;
                    if (inBody) {
                        state.beams.forEach(beam => {
                            totalDose += calculateSingleBeamDose(x, y, beam);
                        });
                    }

                    row.push({ x, y, dose: totalDose, inBody });

                    if (inPTV) ptvDoses.push(totalDose);
                    inOARIndices.forEach(idx => oarsDoses[idx].push(totalDose));
                }
                matrix.push(row);
            }

            state.doseMatrix = matrix;
            calculateDVH(ptvDoses, oarsDoses);
            renderAll();
        }

        // --- INTERFAZ Y RENDERIZADO ---

        function setMode(newMode) {
            state.mode = newMode;
            // Estilos de pestañas
            ['anatomy', 'beam', 'planning'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (m === newMode) {
                    btn.className = 'flex-1 flex flex-col items-center justify-center py-2 px-1 text-xs rounded-md transition bg-indigo-600 text-white shadow-lg transform scale-105';
                } else {
                    btn.className = 'flex-1 flex flex-col items-center justify-center py-2 px-1 text-xs rounded-md transition text-gray-400 hover:bg-gray-800 hover:text-gray-200';
                }
            });
            renderControls();
        }

        function setEnergy(key) {
            state.energyKey = key;
            calculateDoseDistribution(); // Recalcular todo con nueva física
            // No cambiamos de pestaña, nos quedamos en selección para ver la gráfica PDD
            renderControls(); 
        }

        function renderControls() {
            const panel = document.getElementById('controls-panel');
            let html = '';

            if (state.mode === 'anatomy') {
                // --- 1. ANATOMÍA ---
                html = `
                    <div class="bg-blue-900/20 p-3 rounded text-xs text-blue-200 border border-blue-800/50">
                        Define la forma del paciente. Mueve el PTV para simular tumores superficiales o profundos.
                    </div>
                    <!-- Control PTV -->
                    <div class="bg-gray-800 p-3 rounded border-l-4 border-red-500">
                        <h3 class="text-red-400 font-bold text-xs mb-2 uppercase">PTV (Tumor)</h3>
                        <div class="grid grid-cols-3 gap-2 text-xs">
                            <div><label>X</label><input type="number" value="${state.ptv.cx}" oninput="updatePtv('cx', this.value)" class="w-full bg-gray-900 rounded px-1 text-center"></div>
                            <div><label>Y</label><input type="number" value="${state.ptv.cy}" oninput="updatePtv('cy', this.value)" class="w-full bg-gray-900 rounded px-1 text-center"></div>
                            <div><label>Radio</label><input type="number" value="${state.ptv.r}" oninput="updatePtv('r', this.value)" class="w-full bg-gray-900 rounded px-1 text-center"></div>
                        </div>
                    </div>
                    <!-- Control OARs -->
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs font-bold text-gray-400">ÓRGANOS DE RIESGO</span>
                        <button onclick="addOar()" class="bg-blue-600 px-2 py-1 rounded text-xs hover:bg-blue-700">+ Añadir</button>
                    </div>
                    ${state.oars.map((oar, idx) => `
                        <div class="bg-gray-800 p-2 rounded border-l-4 mt-2 text-xs" style="border-left-color: ${getOarColor(idx)}">
                            <div class="flex justify-between mb-1">
                                <input value="${oar.name}" oninput="updateOarName(${oar.id}, this.value)" class="bg-transparent font-bold w-20">
                                <button onclick="removeOar(${oar.id})" class="text-red-400">x</button>
                            </div>
                            <div class="grid grid-cols-3 gap-1">
                                <input type="number" value="${oar.cx}" oninput="updateOar(${oar.id}, 'cx', this.value)" class="bg-gray-900 text-center rounded">
                                <input type="number" value="${oar.cy}" oninput="updateOar(${oar.id}, 'cy', this.value)" class="bg-gray-900 text-center rounded">
                                <input type="number" value="${oar.r}" oninput="updateOar(${oar.id}, 'r', this.value)" class="bg-gray-900 text-center rounded">
                            </div>
                        </div>
                    `).join('')}
                `;
            } else if (state.mode === 'beam') {
                // --- 2. SELECCIÓN DE HAZ (NUEVO) ---
                const currentEnergy = ENERGIES[state.energyKey];
                
                html = `
                    <div class="text-xs text-gray-400 mb-2 text-justify">
                        Selecciona la calidad del haz. Observa cómo cambia la curva de <strong>Rendimiento en Profundidad (PDD)</strong> abajo.
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-4">
                        ${Object.entries(ENERGIES).map(([key, info]) => `
                            <button onclick="setEnergy('${key}')" 
                                class="p-2 rounded border text-left transition relative overflow-hidden ${state.energyKey === key ? 'border-indigo-500 bg-indigo-900/30' : 'border-gray-700 bg-gray-800 hover:bg-gray-700'}">
                                <div class="text-xs font-bold ${state.energyKey === key ? 'text-white' : 'text-gray-300'}">${info.name}</div>
                                <div class="text-[10px] text-gray-500">${info.type === 'electron' ? 'Superficial' : 'Profundo'}</div>
                                ${state.energyKey === key ? '<div class="absolute top-1 right-1 w-2 h-2 bg-indigo-500 rounded-full"></div>' : ''}
                            </button>
                        `).join('')}
                    </div>

                    <!-- GRÁFICA PDD ESTÁTICA -->
                    <div class="bg-gray-900 rounded p-2 border border-gray-700 flex flex-col">
                        <span class="text-[10px] text-gray-400 mb-1">Curva PDD (Dosis vs Profundidad)</span>
                        <div id="pdd-graph-container" class="h-32 w-full relative">
                            <!-- Se rellena con JS -->
                        </div>
                        <div class="flex justify-between text-[10px] text-gray-500 px-1 mt-1">
                            <span>0cm (Sup)</span>
                            <span>~15cm (Prof)</span>
                        </div>
                    </div>
                    
                    <div class="mt-2 p-2 bg-yellow-900/20 text-yellow-200 text-xs rounded border border-yellow-800/50">
                        ${currentEnergy.type === 'electron' 
                            ? '⚠️ <strong>Precaución:</strong> Los electrones tienen un rango limitado. Úsalos solo para lesiones superficiales (piel, cicatrices).'
                            : 'ℹ️ <strong>Info:</strong> Los fotones tienen efecto "skin-sparing" (dosis baja en piel) y penetran profundamente.'}
                    </div>
                `;
                // Renderizar gráfica PDD después de insertar HTML
                setTimeout(renderPDDGraph, 50);

            } else {
                // --- 3. PLANIFICACIÓN ---
                html = `
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="font-bold text-xs text-gray-300">HACES (${ENERGIES[state.energyKey].name})</h2>
                        <button onclick="addBeam()" class="bg-indigo-600 px-2 py-1 rounded text-xs hover:bg-indigo-700">+ Haz</button>
                    </div>
                    ${state.beams.map((beam, idx) => `
                        <div class="bg-gray-900 p-2 rounded border border-gray-700 mb-2 relative">
                            <div class="flex justify-between mb-2">
                                <span class="text-xs font-bold text-yellow-500">Haz ${idx+1}</span>
                                <button onclick="removeBeam(${beam.id})" class="text-gray-500 hover:text-red-400">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                </button>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div>
                                    <label class="text-gray-500">Gantry</label>
                                    <div class="flex items-center gap-1">
                                        <input type="range" min="0" max="360" value="${beam.angle}" oninput="updateBeam(${beam.id}, 'angle', this.value)" class="flex-1">
                                        <span class="w-6 text-right">${beam.angle}°</span>
                                    </div>
                                </div>
                                <div>
                                    <label class="text-gray-500">Peso</label>
                                    <input type="number" step="0.1" value="${beam.weight}" oninput="updateBeam(${beam.id}, 'weight', this.value)" class="w-full bg-gray-800 rounded px-1">
                                </div>
                                <div>
                                    <label class="text-gray-500">Cuña</label>
                                    <select onchange="updateBeam(${beam.id}, 'wedge', this.value)" class="w-full bg-gray-800 rounded">
                                        <option value="0" ${beam.wedge==0?'selected':''}>No</option>
                                        <option value="15" ${beam.wedge==15?'selected':''}>15°</option>
                                        <option value="30" ${beam.wedge==30?'selected':''}>30°</option>
                                        <option value="45" ${beam.wedge==45?'selected':''}>45°</option>
                                        <option value="60" ${beam.wedge==60?'selected':''}>60°</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-gray-500">Ancho</label>
                                    <input type="range" min="5" max="30" value="${beam.width}" oninput="updateBeam(${beam.id}, 'width', this.value)" class="w-full">
                                </div>
                            </div>
                        </div>
                    `).join('')}
                `;
            }
            panel.innerHTML = html;
        }

        function renderPDDGraph() {
            const container = document.getElementById('pdd-graph-container');
            if (!container) return;

            const w = container.clientWidth || 200;
            const h = container.clientHeight || 128;
            const points = [];
            
            // Generar curva PDD para visualización (0 a 40 pixeles de profundidad)
            for (let d = 0; d < 40; d += 0.5) {
                const val = getDepthFactor(d, state.energyKey) * 100; // %
                points.push({ d, val });
            }

            // Crear Path SVG
            let dPath = `M 0 ${h} `; // Iniciar abajo a la izquierda
            points.forEach(p => {
                const x = (p.d / 40) * w;
                const y = h - (p.val / 100) * h;
                dPath += `L ${x} ${y} `;
            });

            // Color según energía
            const color = ENERGIES[state.energyKey].color;

            container.innerHTML = `
                <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
                    <!-- Grid Lines -->
                    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#333" stroke-dasharray="2" />
                    <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="#333" stroke-dasharray="2" />
                    
                    <!-- Area bajo la curva -->
                    <path d="${dPath} L ${w} ${h} Z" fill="${color}" fill-opacity="0.2" />
                    <!-- Línea de la curva -->
                    <path d="${dPath}" fill="none" stroke="${color}" stroke-width="2" />
                </svg>
            `;
        }

        // --- FUNCIONES AUXILIARES SIMPLIFICADAS ---
        const getOarColor = (i) => `hsl(${[210,190,240,170][i%4]}, 80%, 60%)`;
        const isInsideEllipse = (x,y,e) => ((Math.pow(x-e.cx,2)/Math.pow(e.rx,2))+(Math.pow(y-e.cy,2)/Math.pow(e.ry,2))) <= 1;
        const isInsideCircle = (x,y,c) => Math.sqrt(Math.pow(x-c.cx,2)+Math.pow(y-c.cy,2)) <= c.r;
        
        // --- UPDATERS ---
        const updatePtv = (k,v) => { state.ptv[k]=Number(v); calculateDoseDistribution(); };
        const updateOar = (id,k,v) => { state.oars.find(o=>o.id===id)[k]=Number(v); calculateDoseDistribution(); };
        const updateOarName = (id,v) => { state.oars.find(o=>o.id===id).name=v; renderMetrics(); };
        const addOar = () => { state.oars.push({id:Date.now(), cx:40, cy:40, r:4, name:'Nuevo'}); renderControls(); calculateDoseDistribution(); };
        const removeOar = (id) => { state.oars=state.oars.filter(o=>o.id!==id); renderControls(); calculateDoseDistribution(); };
        const updateBeam = (id,k,v) => { state.beams.find(b=>b.id===id)[k]=Number(v); calculateDoseDistribution(); };
        const addBeam = () => { state.beams.push({id:Date.now(), angle:0, weight:1, wedge:0, width:16}); renderControls(); calculateDoseDistribution(); };
        const removeBeam = (id) => { state.beams=state.beams.filter(b=>b.id!==id); renderControls(); calculateDoseDistribution(); };
        
        function calculateDVH(ptvDoses, oarsDosesArray) {
            const getCurve = (arr) => {
                arr.sort((a,b)=>b-a);
                const pts=[];
                for(let d=0; d<=MAX_DOSE_DISPLAY; d+=2) pts.push({d, v:(arr.filter(x=>x>=d).length/arr.length)*100});
                return pts;
            };
            state.dvhData.ptv = getCurve(ptvDoses);
            state.dvhData.oars = oarsDosesArray.map(getCurve);
            
            // Métricas simples
            ptvDoses.sort((a,b)=>b-a);
            state.metrics.ptvD95 = (ptvDoses[Math.floor(ptvDoses.length*0.95)]||0).toFixed(1);
            state.metrics.ptvMax = (ptvDoses[0]||0).toFixed(1);
            state.metrics.oars = oarsDosesArray.map((d,i) => ({
                id: state.oars[i].id, 
                v20: ((d.filter(x=>x>=20).length/d.length)*100).toFixed(1),
                max: (Math.max(...d)||0).toFixed(1)
            }));
            renderMetrics(); // Renderizar métricas al final del cálculo
        }

        // --- RENDERIZADORES GRÁFICOS (DVH, Heatmap, Metrics) ---
        // (Similares a versión anterior pero optimizados)

        function renderHeatmap() {
            const el = document.getElementById('heatmap-container');
            if(!state.doseMatrix.length) return;
            
            // Construir HTML de pixeles una sola vez es costoso, mejor usar Canvas para v3.0 si fuera posible,
            // pero mantendremos el método de DIVs optimizado con string strings
            let gridHtml = '';
            state.doseMatrix.forEach(row => {
                gridHtml += `<div class="flex flex-1">`;
                row.forEach(p => {
                    let bg = 'transparent';
                    if(p.inBody) {
                        if(p.dose<5) bg=COLORS.BODY;
                        else if(p.dose<50) bg=`rgba(16,185,129,${p.dose/100})`;
                        else if(p.dose<90) bg=`rgba(245,158,11,${p.dose/110})`;
                        else bg=`rgba(220,38,38,${Math.min(p.dose/100,1)})`;
                    }
                    gridHtml += `<div class="flex-1" style="background:${bg}"></div>`;
                });
                gridHtml += `</div>`;
            });

            // SVG Overlay
            const svg = `
                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 ${GRID_SIZE} ${GRID_SIZE}">
                     <circle cx="${state.ptv.cx}" cy="${state.ptv.cy}" r="${state.ptv.r}" fill="none" stroke="${COLORS.PTV}" stroke-width="0.8" stroke-dasharray="2,1"/>
                     ${state.oars.map((o,i)=>`<circle cx="${o.cx}" cy="${o.cy}" r="${o.r}" fill="none" stroke="${getOarColor(i)}" stroke-width="0.8"/>`).join('')}
                     ${state.beams.map(b=>{
                         const r = (b.angle-90)*Math.PI/180;
                         const x1 = state.ptv.cx+35*Math.cos(r), y1=state.ptv.cy+35*Math.sin(r);
                         return `<line x1="${x1}" y1="${y1}" x2="${state.ptv.cx}" y2="${state.ptv.cy}" stroke="${COLORS.BEAM}" stroke-width="0.5" opacity="0.6"/>`;
                     }).join('')}
                </svg>
            `;
            el.innerHTML = `<div class="relative w-[300px] h-[300px] bg-black rounded-full overflow-hidden border-2 border-gray-700 flex flex-col">${gridHtml}${svg}</div>`;
            renderDVHGraph(); // Llamar al DVH
        }

        function renderDVHGraph() {
             const el = document.getElementById('dvh-graph');
             const w=280, h=180, pad=20, gw=w-pad*2, gh=h-pad*2;
             const line = (pts, c) => {
                 if(!pts.length) return '';
                 let d = `M ${pad} ${pad+gh} `;
                 pts.forEach(p => d+=`L ${pad+(p.d/MAX_DOSE_DISPLAY)*gw} ${pad+gh-(p.v/100)*gh} `);
                 return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`;
             };
             
             el.innerHTML = `
                <svg viewBox="0 0 ${w} ${h}">
                    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#444"/>
                    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#444"/>
                    <line x1="${pad+(95/MAX_DOSE_DISPLAY)*gw}" y1="${pad}" x2="${pad+(95/MAX_DOSE_DISPLAY)*gw}" y2="${h-pad}" stroke="#444" stroke-dasharray="4"/>
                    ${line(state.dvhData.ptv, COLORS.PTV)}
                    ${state.dvhData.oars.map((pts,i)=>line(pts, getOarColor(i))).join('')}
                </svg>
                <div class="flex gap-2 justify-center text-[10px] mt-1 text-gray-400">
                    <span style="color:${COLORS.PTV}">● PTV</span>
                    ${state.oars.map((o,i)=>`<span style="color:${getOarColor(i)}">● ${o.name}</span>`).join('')}
                </div>
             `;
        }
        
        function renderMetrics() {
            const el = document.getElementById('metrics-panel');
            const m = state.metrics;
            const ok = m.ptvD95 > 95;
            el.innerHTML = `
                <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
                    <span class="font-bold text-sm text-gray-200">Resultados</span>
                    <span class="text-xs px-2 rounded-full ${ok?'bg-green-900 text-green-300':'bg-red-900 text-red-300'}">${ok?'APROBADO':'REVISAR'}</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-gray-800 p-2 rounded">
                        <span class="text-red-400 font-bold block">PTV D95%</span>
                        <span class="text-lg font-mono ${ok?'text-green-400':'text-red-500'}">${m.ptvD95} Gy</span>
                    </div>
                    ${m.oars.map((o,i)=>`
                        <div class="bg-gray-800 p-2 rounded border-t-2" style="border-color:${getOarColor(i)}">
                            <span class="text-gray-300 font-bold block">${state.oars[i].name} V20</span>
                            <span class="text-lg font-mono ${o.v20<20?'text-green-400':'text-yellow-500'}">${o.v20}%</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderAll() { renderControls(); renderHeatmap(); }
        function resetApp() { state.beams=[{id:1, angle:0, weight:1, wedge:0, width:16}]; state.ptv={cx:30, cy:25, r:6}; state.oars=[{id:1, cx:30, cy:38, r:5, name:'Recto'}]; state.energyKey='X6'; setMode('anatomy'); calculateDoseDistribution(); }
        
        window.onload = () => { calculateDoseDistribution(); setMode('anatomy'); };

    </script>
</body>
</html>
